version: "3.3"

services:
  orthanc-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orthanc-server-cms
    ports:
      - "127.0.0.1:4242:4242"
      - "127.0.0.1:8042:8042"
    volumes:
      - orthanc_storage-cms:/var/lib/orthanc/storage
      - orthanc_db-cms:/var/lib/orthanc/db
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
    environment:
      - MALLOC_ARENA_MAX=5
    depends_on:
      - postgres-cms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8042/system"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - orthanc_network

  postgres-cms:
    image: postgres:14
    container_name: orthanc-postgres-cms
    environment:
      - POSTGRES_DB=orthanc
      - POSTGRES_USER=orthanc
      - POSTGRES_PASSWORD=orthanc
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data-cms:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthanc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - orthanc_network

volumes:
  orthanc_storage-cms:
    driver: local
  orthanc_db-cms:
    driver: local
  postgres_data-cms:
    driver: local

networks:
  orthanc_network:
    driver: bridge
